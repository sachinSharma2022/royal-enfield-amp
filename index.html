<!doctype html>
<html ⚡>

<head>
  <meta charset="utf-8" />
  <title>AMP Image & Slider Demo</title>
  <link rel="canonical" href="https://example.com/demo.html" />
  <meta name="viewport" content="width=device-width,minimum-scale=1,initial-scale=1" />
  <link rel="stylesheet" href="css/style.css">

  <!-- AMP runtime -->
  <script async src="https://cdn.ampproject.org/v0.js"></script>
  <!-- AMP carousel component -->
  <script async custom-element="amp-carousel" src="https://cdn.ampproject.org/v0/amp-carousel-0.2.js"></script>
  <script async custom-element="amp-sidebar" src="https://cdn.ampproject.org/v0/amp-sidebar-0.1.js"></script>
  <style amp-boilerplate>
    body {
      background-color: #000;
      -webkit-animation: -amp-start 8s steps(1, end) 0s 1 normal both;
      -moz-animation: -amp-start 8s steps(1, end) 0s 1 normal both;
      -ms-animation: -amp-start 8s steps(1, end) 0s 1 normal both;
      animation: -amp-start 8s steps(1, end) 0s 1 normal both;
    }

    @-webkit-keyframes -amp-start {
      from {
        visibility: hidden
      }

      to {
        visibility: visible
      }
    }

    @-moz-keyframes -amp-start {
      from {
        visibility: hidden
      }

      to {
        visibility: visible
      }
    }

    @-ms-keyframes -amp-start {
      from {
        visibility: hidden
      }

      to {
        visibility: visible
      }
    }

    @-o-keyframes -amp-start {
      from {
        visibility: hidden
      }

      to {
        visibility: visible
      }
    }

    @keyframes -amp-start {
      from {
        visibility: hidden
      }

      to {
        visibility: visible
      }
    }
  </style>
  <noscript>
    <style amp-boilerplate>
      body {
        -webkit-animation: none;
        -moz-animation: none;
        -ms-animation: none;
        animation: none;
      }
    </style>
  </noscript>

  <style amp-custom>
    h1 {
      color: #0066cc;
      text-align: center;
    }

    p {
      font-size: 16px;
      color: #333;
      text-align: center;
    }

    amp-carousel {
      margin-top: 20px;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgb(0 0 0 / 0.2);
    }

    amp-img {
      width: 100%;
      height: auto;
      display: block;
    }

    header {
      background: #000;
      color: #fff;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: block;
      width: 100%;
      max-width: 100px;
      height: auto;
    }

    .logo img {
      height: auto;
      min-height: auto;
      margin: 0;
    }

    nav {
      display: none;
    }

    .desktop-nav {
      display: flex;
      gap: 15px;
    }

    .desktop-nav li {
      list-style: none;
    }

    .desktop-nav a {
      color: #fff;
      text-decoration: none;
      font-weight: bold;
    }

    .menu-btn {
      background: none;
      border: none;
      font-size: 24px;
      color: white;
      display: inline-block;
    }

    @media (min-width: 768px) {
      .menu-btn {
        display: none;
      }

      nav {
        display: block;
      }
    }

    amp-sidebar {
      width: 250px;
      background: #111;
      padding: 20px;
    }

    amp-sidebar a {
      display: block;
      color: #fff;
      margin: 10px 0;
      text-decoration: none;
      font-size: 18px;
    }
  </style>

</head>

<body>

  <amp-sidebar id="sidebar" layout="nodisplay" side="left">
    <a href="#">Motorcycles</a>
    <a href="#">Contacts</a>
    <a href="#">Cloth</a>
    <a href="#">Our World</a>
    <a href="#">Support</a>
  </amp-sidebar>

  <header>
    <a href="#" class="logo">
      <amp-img src="images/logo.avif" width="100" height="100" layout="responsive" alt="Logo"></amp-img>
    </a>

    <button class="menu-btn" on="tap:sidebar.toggle">&#9776;</button>

    <nav>
      <ul class="desktop-nav">
        <li><a href="#">Motorcycles</a></li>
        <li><a href="#">Contacts</a></li>
        <li><a href="#">Cloth</a></li>
        <li><a href="#">Our World</a></li>
        <li><a href="#">Support</a></li>
      </ul>
    </nav>
  </header>

  <!-- AMP Carousel -->
  <amp-carousel width="600" height="300" layout="responsive" type="slides" autoplay delay="3000" loop>
    <amp-img src="https://cdn.pixabay.com/photo/2017/11/23/04/07/royal-enfield-2972005_1280.jpg" width="600"
      height="300" layout="responsive" alt="Slide 1"></amp-img>
    <amp-img src="https://cdn.pixabay.com/photo/2016/09/02/14/23/bike-rider-1639323_1280.jpg" width="600" height="300"
      layout="responsive" alt="Slide 2"></amp-img>
    <amp-img src="https://cdn.pixabay.com/photo/2021/01/15/17/19/royal-enfield-5919885_1280.jpg" width="600"
      height="300" layout="responsive" alt="Slide 3"></amp-img>
  </amp-carousel>

</body>

</html>
