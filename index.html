<!doctype html>
<html ⚡>
<head>
  <meta charset="utf-8" />
  <title>AMP Image & Slider Demo</title>
  <link rel="canonical" href="https://example.com/demo.html" />
  <meta name="viewport" content="width=device-width,minimum-scale=1,initial-scale=1" />
  <link rel="stylesheet" href="css/style.css">

  <!-- AMP runtime -->
  <script async src="https://cdn.ampproject.org/v0.js"></script>
  <!-- AMP carousel component -->
  <script async custom-element="amp-carousel" src="https://cdn.ampproject.org/v0/amp-carousel-0.2.js"></script>
</head>
<body>

  <h1>AMP Image and Slider Demo</h1>
  <p>Simple AMP page showing an image and a carousel slider.</p>

  <!-- Single AMP image -->
  <amp-img src="https://via.placeholder.com/600x300.png?text=Single+Image" width="600" height="300" layout="responsive" alt="Sample Image"></amp-img>

  <!-- AMP Carousel -->
  <amp-carousel width="600" height="300" layout="responsive" type="slides" autoplay delay="3000" loop>
    <amp-img src="https://cdn.pixabay.com/photo/2017/11/23/04/07/royal-enfield-2972005_1280.jpg" width="600" height="300" layout="responsive" alt="Slide 1"></amp-img>
    <amp-img src="https://cdn.pixabay.com/photo/2016/09/02/14/23/bike-rider-1639323_1280.jpg" width="600" height="300" layout="responsive" alt="Slide 2"></amp-img>
    <amp-img src="https://cdn.pixabay.com/photo/2021/01/15/17/19/royal-enfield-5919885_1280.jpg" width="600" height="300" layout="responsive" alt="Slide 3"></amp-img>
  </amp-carousel>

</body>
</html>
